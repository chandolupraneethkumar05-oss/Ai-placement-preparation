databases:
  # =========================================================================
  # Permanent PostgreSQL Database (Managed by Render)
  # Persistent storage: all accounts, resumes, tests remain permanently!
  # =========================================================================
  - name: autoplace-db
    databaseName: autoplace_db
    user: autoplace_user
    plan: free

services:
  # =========================================================================
  # Unified Full-Stack Service: React Frontend + FastAPI Backend
  # Serves the complete application on a SINGLE URL and SINGLE service!
  # Zero CORS, Zero cross-origin "Failed to fetch", 100% Free Plan ($0/month).
  # =========================================================================
  - type: web
    name: ai-placement-preparation
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: autoplace-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
