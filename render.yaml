services:
  # ==========================================
  # 1. FastAPI Backend (Web Service)
  # ==========================================
  - type: web
    name: autoplace-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./placement.db
      - key: SECRET_KEY
        generateValue: true

  # ==========================================
  # 2. React + Vite Frontend (Static Site)
  # ==========================================
  - type: web
    name: autoplace-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: autoplace-ai-backend
          property: host
