services:
  # =========================================================================
  # Unified Full-Stack Service: React Frontend + FastAPI Backend
  # Serves the complete application on a SINGLE URL and SINGLE service!
  # Zero CORS, Zero cross-origin network latency, 100% Free Plan ($0/month).
  # Uses Managed PostgreSQL Database for production persistence.
  # =========================================================================
  - type: web
    name: ai-placement-preparation
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-placement-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  # Managed PostgreSQL Database for Production Persistence
  - name: ai-placement-db
    databaseName: placement_db
    user: placement_user
    plan: free
